# Development overlay for local source edits.
# Usage:
# docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build

services:
  app:
    build:
      context: .
      args:
        # Attention: installed plugins in the node_modules folder get overwritten during volume mount in dev
        ETHERPAD_PLUGINS:
      # change from development to production if needed
      target: development
    command: ["pnpm", "run", "dev"]
    volumes:
      # Mount source directories but exclude node_modules to preserve build-time dependencies
      - ./src:/opt/etherpad-lite/src
      - /opt/etherpad-lite/src/node_modules
      - ./ui:/opt/etherpad-lite/ui
      - /opt/etherpad-lite/ui/node_modules
      - ./admin:/opt/etherpad-lite/admin
      - /opt/etherpad-lite/admin/node_modules
      - ./bin:/opt/etherpad-lite/bin
      - /opt/etherpad-lite/bin/node_modules
      - /opt/etherpad-lite/node_modules
    environment:
      NODE_ENV: development
      # Database and AI settings are read from settings.json and .env.
    restart: always
    ports:
      - "${DOCKER_COMPOSE_APP_DEV_PORT_PUBLISHED:-9001}:${DOCKER_COMPOSE_APP_DEV_PORT_TARGET:-9001}"
