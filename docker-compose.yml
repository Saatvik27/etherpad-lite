services:
  app:
    user: "5001:0"
    build:
      context: .
      target: production
    tty: true
    stdin_open: true
    env_file:
      - .env
    volumes:
      - plugins:/opt/etherpad-lite/src/plugin_packages
      - etherpad-var:/opt/etherpad-lite/var
    environment:
      NODE_ENV: production
      # Secrets and runtime config (including SUPABASE_DB_PASSWORD) come from .env
      # settings.json is the source of truth for database settings.
    restart: always
    ports:
      - "${DOCKER_COMPOSE_APP_PORT_PUBLISHED:-9001}:${DOCKER_COMPOSE_APP_PORT_TARGET:-9001}"

volumes:
  plugins:
  etherpad-var:
